<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knock</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar">
      <span class="badge" id="badge">승인 요청</span>
      <h1 id="title">Knock</h1>
      <label id="tts-toggle-wrap" class="td-toggle hidden" title="게이트 알림 음성 낭독(TTS) 켜기/끄기">
        <input type="checkbox" id="tts-header-toggle" />
        <span class="td-switch"></span>
        <span class="td-text">🔊</span>
      </label>
      <label id="td-toggle-wrap" class="td-toggle hidden" title="이 요청과 이후 요청에 Touch ID 요구">
        <input type="checkbox" id="td-toggle" />
        <span class="td-switch"></span>
        <span class="td-text">🔒 Touch ID</span>
      </label>
      <label id="merge-toggle-wrap" class="td-toggle merge-toggle hidden" title="켜면 이후 머지 승인 창 없이 바로 실행됩니다. 다른 위험 명령이 섞이면 창이 뜹니다.">
        <input type="checkbox" id="merge-toggle" />
        <span class="td-switch"></span>
        <span class="td-text">🔀 자동 승인</span>
      </label>
    </header>

    <!-- update-available banner (dismissible, per-version) -->
    <div id="update-banner" class="update-banner hidden">
      <span id="update-text"></span>
      <button id="update-copy" class="ub-btn" type="button">brew upgrade 복사</button>
      <a id="update-notes" class="ub-btn" href="#">릴리스 노트</a>
      <button id="update-dismiss" class="ub-btn ub-x" type="button" title="이 버전 알림 끄기">✕</button>
    </div>

    <!-- annotate mode -->
    <main id="content" class="markdown hidden"></main>

    <!-- drag to rebalance request vs panel; arrows work too (see main.ts) -->
    <div
      id="split-handle"
      class="split-handle hidden"
      role="separator"
      aria-orientation="vertical"
      aria-label="요청과 패널 너비 조절"
      tabindex="0"
    ></div>

    <!-- annotate side panel (--view): sandboxed local HTML, never the decision surface -->
    <aside id="view-panel" class="view-panel hidden">
      <div class="view-cap">
        <span class="view-cap-text">외부 콘텐츠 — 왼쪽 요청과 별개, 승인 버튼 없음</span>
        <button
          id="view-mode"
          class="view-open view-mode hidden"
          type="button"
          title="이동 방식 바꾸기 — 스크롤 → 섹션 → 카드 (단축키 v)"
        >스크롤</button>
        <button
          id="view-open"
          class="view-open hidden"
          type="button"
          title="브라우저에서 열기 — 전체 화면 · 찾기 · 인쇄"
          aria-label="브라우저에서 열기"
        >↗</button>
      </div>
      <iframe id="view-frame" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
    </aside>

    <!-- ask mode -->
    <div id="ask-root" class="ask hidden"></div>

    <!-- settings mode -->
    <div id="settings-root" class="settings hidden">
      <label class="toggle-row">
        <input type="checkbox" id="touch-id-toggle" />
        <div class="toggle-text">
          <div class="toggle-label">🔒 승인·질문에 Touch ID를 기본 사용</div>
          <div class="toggle-desc">
            모든 승인과 질문 제출에 지문 / Windows Hello 인증을 요구합니다.
            명령의 <code>--touch-id</code> 옵션은 이 설정이 꺼져 있어도 항상 적용됩니다.
          </div>
        </div>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="auto-approve-merge-toggle" />
        <div class="toggle-text">
          <div class="toggle-label">🔀 PR 머지 승인을 자동 승인</div>
          <div class="toggle-desc" id="auto-approve-merge-desc">
            켜면 4시간 동안 유지됩니다. 다른 위험 명령이 섞이면 창이 뜹니다. 켜져 있는 동안 머지마다 하던 검토가 생략됩니다.
          </div>
        </div>
      </label>
      <div class="tts-options" id="auto-approve-merge-options">
        <label class="tts-opt-row">
          <span class="tts-opt-label">자동 승인 기간</span>
          <select id="auto-approve-merge-duration">
            <option value="four_hours">4시간 (기본)</option>
            <option value="eight_hours">8시간</option>
            <option value="midnight">오늘 자정까지 (로컬 시간)</option>
          </select>
        </label>
        <div class="toggle-desc">기간 선택은 다음에 켤 때 적용됩니다. 현재 켜진 승인의 만료 시각은 바뀌지 않습니다.</div>
      </div>
      <section class="slack-settings" aria-labelledby="slack-settings-title">
        <h2 id="slack-settings-title">Slack 승인</h2>
        <label class="toggle-row">
          <input type="checkbox" id="slack-enabled" />
          <div class="toggle-text">
            <div class="toggle-label">Slack Socket Mode 사용</div>
            <div class="toggle-desc">기본은 꺼져 있습니다. 대상은 <code>--remote-approve</code> 를 붙인 게이트, 허용한 Scalr 주소, 선택 UI(버튼·체크박스·기타 입력)로 답할 수 있는 ask 질문입니다 (아래 옵션을 켜면 모든 게이트).</div>
          </div>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="slack-remote-default" />
          <div class="toggle-text">
            <div class="toggle-label">모든 게이트를 Slack 으로도 보내기</div>
            <div class="toggle-desc">꺼져 있으면 호출자가 <code>--remote-approve</code> 를 붙인 게이트와 허용 호스트의 <code>--action-url</code> 게이트만 보냅니다. 켜면 <code>--gate</code> 게이트 전부가 대상이 되고, 맥 창에서만 받을 게이트는 호출자가 <code>--local-only</code> 로 뺍니다. Touch ID 게이트는 항상 제외됩니다.</div>
          </div>
        </label>
        <div class="slack-fields">
          <label class="tts-opt-row tts-opt-col">
            <span class="tts-opt-label">owner Slack 사용자 ID</span>
            <input id="slack-owner-user-id" type="text" placeholder="U0123456789" autocomplete="off" />
          </label>
          <label class="tts-opt-row tts-opt-col">
            <span class="tts-opt-label">원격 승인 허용 호스트 (쉼표 또는 줄바꿈)</span>
            <textarea id="slack-remote-action-hosts" rows="2" spellcheck="false"></textarea>
          </label>
          <label class="tts-opt-row tts-opt-col">
            <span class="tts-opt-label">App-Level Token (xapp-)</span>
            <input id="slack-app-token" class="slack-secret" type="password" autocomplete="new-password" />
          </label>
          <label class="tts-opt-row tts-opt-col">
            <span class="tts-opt-label">Bot Token (xoxb-)</span>
            <input id="slack-bot-token" class="slack-secret" type="password" autocomplete="new-password" />
          </label>
          <div class="slack-actions">
            <button id="slack-save" class="btn primary" type="button">Slack 설정 저장</button>
            <button id="slack-test" class="btn ghost" type="button">연결 시험</button>
            <span id="slack-status" role="status" aria-live="polite"></span>
          </div>
        </div>
      </section>

      <label class="toggle-row">
        <input type="checkbox" id="tts-toggle" />
        <div class="toggle-text">
          <div class="toggle-label">🔊 승인·질문 알림 음성 낭독 (TTS)</div>
          <div class="toggle-desc">
            새 게이트가 뜨면 소리로 읽어줍니다. 기본은 OS 내장 음성
            (macOS say · Windows SAPI). 온디바이스 Supertonic 엔진은
            <code>knock tts install</code> 로 켤 수 있습니다.
          </div>
        </div>
      </label>

      <!-- TTS 세부 옵션 (TTS 켜졌을 때만 표시) -->
      <div id="tts-options" class="tts-options hidden">
        <label class="tts-opt-row">
          <span class="tts-opt-label">낭독 범위</span>
          <select id="tts-scope">
            <option value="title">제목만 (헤더 알림)</option>
            <option value="full">내용까지 브리핑</option>
          </select>
        </label>
        <label class="tts-opt-row">
          <span class="tts-opt-label">스타일</span>
          <select id="tts-style">
            <option value="plain">일반</option>
            <option value="delivery">배달 알림 (반복)</option>
          </select>
        </label>
        <label class="tts-opt-row">
          <span class="tts-opt-label">보이스</span>
          <select id="tts-voice">
            <option value="">기본 (배달=F1)</option>
            <option value="F1">F1 (여성)</option>
            <option value="F2">F2 (여성)</option>
            <option value="F3">F3 (여성)</option>
            <option value="F4">F4 (여성)</option>
            <option value="F5">F5 (여성)</option>
            <option value="M1">M1 (남성)</option>
            <option value="M2">M2 (남성)</option>
            <option value="M3">M3 (남성)</option>
            <option value="M4">M4 (남성)</option>
            <option value="M5">M5 (남성)</option>
          </select>
        </label>
        <label class="tts-opt-row" id="tts-repeat-row">
          <span class="tts-opt-label">반복 횟수</span>
          <input type="number" id="tts-repeat" min="1" max="10" step="1" />
        </label>
        <label class="tts-opt-row tts-opt-col" id="tts-phrase-row">
          <span class="tts-opt-label">배달 문구 <code>{n}</code>=건수</span>
          <input type="text" id="tts-phrase" placeholder="노크 주문! 대기중인 요청 {n}건입니다." />
        </label>
      </div>

      <div class="settings-meta">
        <a href="#" id="report-bug">🐞 버그 신고</a>
        <a href="#" id="release-notes">📋 릴리스 노트</a>
        <span id="version-tag" class="version-tag"></span>
      </div>
    </div>

    <footer class="actions">
      <!-- annotate actions (vertical option cards, like ask) -->
      <div id="annotate-footer" class="hidden">
        <div class="ask-options">
          <div class="ask-opt" id="opt-approve" tabindex="0">
            <span class="ask-opt-num">1</span>
            <div class="ask-opt-body"><div class="ask-opt-label">✓ 승인</div></div>
          </div>
          <label class="ask-opt ann-input">
            <span class="ask-opt-num">2</span>
            <textarea
              id="feedback"
              class="ann-textarea"
              rows="2"
              placeholder="변경요청·피드백 입력 → 제출 (Cmd+Enter · 이미지 붙여넣기 가능)"
            ></textarea>
          </label>
          <div class="ask-opt" id="opt-cancel" tabindex="0">
            <span class="ask-opt-num">3</span>
            <div class="ask-opt-body"><div class="ask-opt-label">✗ 취소</div></div>
          </div>
        </div>
        <div class="btn-row">
          <button id="send" class="btn primary" disabled title="Cmd+Enter">
            제출 ✓
          </button>
        </div>
      </div>

      <!-- ask actions (wizard) -->
      <div id="ask-footer" class="btn-row hidden">
        <button id="ask-dismiss" class="btn ghost" title="Esc">✗ 닫기</button>
        <button id="ask-prev" class="btn ghost hidden" title="← 방향키">← 이전</button>
        <button id="ask-next" class="btn primary" disabled title="→ 방향키">다음 →</button>
        <button id="ask-submit" class="btn primary hidden" title="Cmd+Enter">제출 ✓</button>
      </div>

      <!-- settings actions -->
      <div id="settings-footer" class="btn-row hidden">
        <button id="settings-close" class="btn primary" title="Esc">완료</button>
      </div>
    </footer>
  </body>
</html>
