[package]
name = "knock"
version = "0.8.1"
description = "Desktop approval/annotation gate for AI agents"
authors = ["hihenen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "knock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.12"
base64 = "0.22"
robius-authentication = "0.1"
interprocess = "2"
ammonia = "4"
tempfile = "3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls-no-alpn"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "native-tls"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
